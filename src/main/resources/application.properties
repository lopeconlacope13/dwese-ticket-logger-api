spring.application.name=dwese-ticket-logger-api
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# --- HIBERNATE / JPA ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# !!! CAMBIO IMPORTANTE !!!
# Comentamos esto para que Hibernate detecte automáticamente el dialecto de MariaDB.
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.sql.init.mode=always
logging.level.org.springframework.jdbc.datasource.DataSourceTransactionManager=ERROR
spring.datasource.hikari.maximum-pool-size=10

# --- ARCHIVOS ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.path=${UPLOAD_PATH}

# --- SEGURIDAD JWT (RSA) ---
# Si has limpiado tu clase JwtUtil como te sugerí para usar RSA (Claves pública/privada),
# ya NO necesitas 'jwt.secret'. Puedes borrarla si quieres evitar confusión.
jwt.secret=${JWT_SECRET}
jwt.max.expiration.seconds=86400

# Configuración del Keystore (RSA)
jwt.keystore.path=${JWT_KEYSTORE_PATH}
jwt.keystore.password=${JWT_KEYSTORE_PASSWORD}
jwt.keystore.alias=${JWT_KEYSTORE_ALIAS:jwt-keypair}

# Dominios permitidos para CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}


# Configuración de MongoDB (WebFlux)
#spring.data.mongodb.uri=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@localhost:27017/${MONGO_DATABASE}?authSource=admin
#spring.data.mongodb.database=${MONGO_DATABASE}

# Configuración MongoDB (Explícita)
spring.mongodb.uri=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@localhost:27017/${MONGO_DATABASE}?authSource=admin
spring.mongodb.database=${MONGO_DATABASE}

